<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <title>MUS Prompt</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div>
      <h1>MUS Prompt</h1>
      <p>影视配乐 · Suno 提示词</p>
    </div>
    <div id="statusPill" class="pill pill-idle">载入中…</div>
  </header>

  <main class="grid">
    <div class="stack">
    <section class="card" id="s0Card">
      <h2>题材</h2>
      <p class="hint">先选题材模板，再确认分类与取向卡。</p>
      <div class="row two">
        <div class="field">
          <label for="templateId">题材模板</label>
          <select id="templateId"></select>
        </div>
        <div class="field">
          <label>模板状态</label>
          <div id="templateBadge" class="badges"></div>
        </div>
      </div>
      <p id="coverageLine" class="hint"></p>
    </section>

    <section class="card" id="s15Card">
      <h2>题材分类</h2>
      <p class="hint">四项分类决定取向卡；没有匹配时不生成。</p>
      <div id="s15Fields" class="row two"></div>
      <div id="cardResult" class="theme-card"></div>
    </section>

    <section class="card">
      <h2>点选</h2>
      <p class="hint">按词表选择，不开放自由输入。</p>

      <div class="row two">
        <div class="field">
          <label for="bucket">情绪基调</label>
          <select id="bucket"></select>
        </div>
        <div class="field">
          <label for="topic">场景主题</label>
          <select id="topic"></select>
        </div>
      </div>

      <div class="field">
        <label>情绪词（随场景带出）</label>
        <div id="moodWords" class="checks"></div>
      </div>

      <div class="row three">
        <div class="field">
          <label for="instruments">主奏乐器</label>
          <input id="instruments" type="text" readonly>
        </div>
        <div class="field">
          <label for="bpm">BPM</label>
          <input id="bpm" type="text" readonly>
        </div>
        <div class="field">
          <label for="duration">建议时长</label>
          <input id="duration" type="text" readonly>
        </div>
      </div>

      <div class="row two">
        <div class="field">
          <label for="purposeProfile">用途剖面</label>
          <input id="purposeProfile" type="text" value="通用配乐素材库">
        </div>
        <div class="field">
          <label for="pictureFunction">画面功能</label>
          <input id="pictureFunction" type="text" value="转场">
        </div>
      </div>

      <div class="field">
        <label for="moodArc">情绪走向（中文）</label>
        <input id="moodArc" type="text" value="安静起 → 平稳铺陈 → 温和收束">
      </div>

      <div class="field">
        <label for="paramDeviation">参数偏离</label>
        <input id="paramDeviation" type="text" value="无（沿用 W25／SI80 基线）">
      </div>

      <div class="row two">
        <div class="field">
          <label for="exclude1">排除项 1</label>
          <input id="exclude1" type="text" value="不写完整主题旋律">
        </div>
        <div class="field">
          <label for="exclude2">排除项 2</label>
          <input id="exclude2" type="text" value="不引入人声与戏曲音色">
        </div>
      </div>

      <div class="row two">
        <div class="field">
          <label>排除词组（最多 3 组）</label>
          <div id="negativeGroups" class="checks"></div>
        </div>
        <div class="field">
          <label for="itemVersion">条目版本</label>
          <input id="itemVersion" type="text" value="v1">
        </div>
      </div>
    </section>
    </div>

    <aside class="side">
      <section class="card lock">
        <h2>纯器乐 <span class="tag">已锁定</span></h2>
        <div class="field">
          <label for="lyricsBox">歌词</label>
          <input id="lyricsBox" class="mono" type="text" value="[Instrumental]" readonly>
        </div>
        <div class="copy-row">
          <button id="copyTagBtn" type="button" class="secondary">复制 [Instrumental]</button>
          <button id="copyPlainBtn" type="button" class="secondary">复制 Instrumental</button>
          <span id="copyFeedback" class="copy-feedback" aria-live="polite"></span>
        </div>
        <div class="locked-line">
          <input type="checkbox" checked disabled>
          <span class="mono">no vocals</span>
          <span class="muted">不可删</span>
        </div>
        <ul class="rules">
          <li>不提供人声开关。</li>
          <li>不生成歌曲结构标签。</li>
        </ul>
      </section>

      <section class="card">
        <h2>导出</h2>
        <p class="hint">生成 1 条 Suno 提示词文件，保存在本机。</p>
        <button id="exportBtn" type="button">生成并导出</button>
        <pre id="resultBox" class="result">尚未生成</pre>
      </section>

      <section class="card scope">
        <h2>说明</h2>
        <p>英文提示词由程序自动生成，使用前请人工核对。</p>
      </section>
    </aside>
  </main>

  <script src="renderer.js"></script>
</body>
</html>
